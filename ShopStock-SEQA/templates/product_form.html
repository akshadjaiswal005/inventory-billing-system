{% extends 'base.html' %}{% block title %}{{ 'Edit' if product else 'Add' }} product{% endblock %}{% block content %}<section class="page-heading"><div><div class="eyebrow">PRODUCT CATALOG</div><h1>{{ 'Edit product' if product else 'Add product' }}</h1><p class="muted">Enter the product details below.</p></div><a class="btn btn-secondary" href="{{ url_for('products_page') }}">← Back</a></section><section class="panel form-panel"><form method="post" class="form-grid"><label>Product name<input name="name" required value="{{ product.name if product else '' }}" placeholder="e.g. Notebook"></label><label>SKU / Product ID<input name="sku" required value="{{ product.sku if product else '' }}" placeholder="e.g. SKU-1004"></label><label>Unit price (₹)<input name="price" type="number" min="0" step="0.01" required value="{{ product.price if product else '' }}"></label><label>Quantity in stock<input name="quantity" type="number" min="0" step="1" required value="{{ product.quantity if product else '0' }}"></label><label>Tax rate (%)<input name="tax_rate" type="number" min="0" max="100" step="0.01" value="{{ product.tax_rate if product else '0' }}"></label><label>Low-stock threshold<input name="low_stock_threshold" type="number" min="0" step="1" value="{{ product.low_stock_threshold if product else '5' }}"></label><div class="form-actions"><button class="btn btn-primary">{{ 'Save changes' if product else 'Create product' }}</button><a class="btn btn-secondary" href="{{ url_for('products_page') }}">Cancel</a></div></form></section>{% endblock %}
